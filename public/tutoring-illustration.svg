<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="500" viewBox="0 0 600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Elements -->
  <rect x="450" y="50" width="100" height="100" fill="#E3F2FD" rx="10"/>
  <circle cx="500" cy="100" r="30" fill="#FF6B00" opacity="0.2"/>
  <path d="M50 400 L100 450 L50 500" stroke="#1A237E" stroke-width="2" opacity="0.1"/>
  
  <!-- Student Illustration -->
  <g transform="translate(100, 50)">
    <!-- Laptop -->
    <rect x="100" y="200" width="200" height="120" fill="#F5F5F5" rx="10"/>
    <rect x="110" y="210" width="180" height="90" fill="#fff" rx="5"/>
    
    <!-- Student -->
    <g transform="translate(150, 100)">
      <!-- Body -->
      <rect x="0" y="50" width="100" height="150" fill="#FF6B00" rx="20"/>
      
      <!-- Head -->
      <circle cx="50" cy="30" r="30" fill="#FFB74D"/>
      <path d="M30 20 Q50 40 70 20" stroke="#000" stroke-width="2" fill="none"/>
      
      <!-- Hair -->
      <path d="M20 30 Q50 0 80 30" stroke="#000" stroke-width="10" fill="#000"/>
    </g>
    
    <!-- Study Elements -->
    <circle cx="400" cy="100" r="20" fill="#1A237E" opacity="0.1"/>
    <rect x="380" y="150" width="40" height="40" fill="#FF6B00" opacity="0.2" transform="rotate(45)"/>
    <path d="M350 50 L370 70 L350 90" stroke="#1A237E" stroke-width="2" opacity="0.1"/>
  </g>
</svg> 